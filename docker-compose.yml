services:
  web:
    image: ghcr.io/huangmingzhi0206/portfolioks:v1.0.1
    restart: unless-stopped
    environment:
      # Coolify assigns the domain to this service and port.
      # Set the actual hostname in the app's Domains tab, as http:// —
      # TLS is terminated at Cloudflare, not here.
      - SERVICE_FQDN_WEB_5000
      # Points at the managed PostgreSQL resource in Coolify.
      # Its internal connection string goes in Environment Variables.
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - RUN_LOCAL=true
    expose:
      - "5000"
